<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Matrix Love Code</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #050308;
    --bg-2: #0a0612;
    --pink: #ff2f78;
    --pink-soft: #ff7ab0;
    --cream: #f3ede2;
    --panel: rgba(14, 8, 18, 0.55);
    --panel-border: rgba(255, 47, 120, 0.35);
    --text-dim: #caa9bd;
  }
  /* This piece is a deliberately dark, cinematic "night love letter" —
     the dark stage is the point, so it stays dark in both schemes. */
  :root:not([data-theme="light"]){
    --bg: #050308; --bg-2: #0a0612;
  }
  :root[data-theme="dark"]{
    --bg: #050308; --bg-2: #0a0612;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --bg: #050308; --bg-2: #0a0612; }
  }

  *{ box-sizing: border-box; }
  html, body{
    margin:0; padding:0; width:100%; height:100%; overflow:hidden;
    background: radial-gradient(ellipse at 50% 30%, var(--bg-2), var(--bg) 70%);
    font-family: 'JetBrains Mono', monospace;
  }
  #stage{
    position: fixed; inset: 0; width:100%; height:100%; display:block;
  }

  .ui{
    position: fixed;
    left: 50%; bottom: 22px; transform: translateX(-50%);
    display: flex; gap: 8px; align-items: center;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    backdrop-filter: blur(10px);
    border-radius: 999px;
    padding: 8px 8px 8px 16px;
    z-index: 10;
    box-shadow: 0 8px 30px rgba(255,47,120,0.15);
    max-width: min(92vw, 460px);
  }
  .ui input{
    background: transparent;
    border: none;
    outline: none;
    color: var(--cream);
    font-family: 'Quicksand', sans-serif;
    font-weight: 600;
    font-size: 14px;
    width: 150px;
    letter-spacing: 0.2px;
  }
  .ui input::placeholder{ color: var(--text-dim); }
  .ui button{
    border: none;
    background: linear-gradient(135deg, var(--pink), #c2185b);
    color: #1a0410;
    font-family: 'Quicksand', sans-serif;
    font-weight: 700;
    font-size: 13px;
    padding: 8px 16px;
    border-radius: 999px;
    cursor: pointer;
    letter-spacing: 0.3px;
    transition: transform 120ms ease, filter 120ms ease;
  }
  .ui button:hover{ filter: brightness(1.12); transform: translateY(-1px); }
  .ui button:active{ transform: translateY(0px) scale(0.98); }

  .credit{
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    font-family: 'Quicksand', sans-serif;
    font-size: 12px; font-weight: 600;
    color: var(--text-dim);
    letter-spacing: 0.5px;
    z-index: 10;
    opacity: 0.8;
    text-align: center;
  }

  @media (prefers-reduced-motion: reduce){
    #stage{ animation: none; }
  }
</style>
</head>
<body>

<canvas id="stage"></canvas>
<audio id="bgm" loop preload="auto"></audio>

<button id="muteBtn" aria-label="Mute/unmute musik">🔊</button>

<style>
  #muteBtn{
    position: fixed;
    right: 18px; bottom: 18px;
    width: 44px; height: 44px;
    border-radius: 50%;
    border: 1px solid rgba(255,47,120,0.35);
    background: rgba(14,8,18,0.55);
    backdrop-filter: blur(10px);
    color: #f3ede2;
    font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    z-index: 10;
    transition: transform 120ms ease, filter 120ms ease;
  }
  #muteBtn:hover{ filter: brightness(1.15); transform: translateY(-1px); }
  #muteBtn:active{ transform: translateY(0) scale(0.96); }
</style>

<script>
(function(){

  // ============================================================
  //  KONFIGURASI — ubah nama di sini, BUKAN lewat tampilan.
  //  Ini satu-satunya baris yang perlu diedit sebelum di-upload.
  // ============================================================
  const RECIPIENT_NAME = "Nurfah";     // ganti dengan nama tujuan
  const CLICK_TO_REPLAY = true;        // klik/tap layar untuk mengulang animasi
  const MUSIC_SRC = "song.mp3";        // nama file mp3, letakkan di folder yang sama
  const MUSIC_LOOP = true;             // ulang lagu terus-menerus
  const MUSIC_VOLUME = 0.6;            // 0.0 - 1.0
  // ============================================================

  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');
  let W, H, DPR;

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    setupRain();
  }

  // ---------- MATRIX RAIN (background layer) ----------
  const RAIN_CHARS = ['I','L','O','V','E','Y','O','U','I','L','O','V','E', '♥','♡'];
  let columns = [];
  const COL_WIDTH = 16;

  function setupRain(){
    const count = Math.ceil(W / COL_WIDTH);
    columns = new Array(count).fill(null).map((_, i) => ({
      x: i * COL_WIDTH + COL_WIDTH / 2,
      y: Math.random() * -H,
      speed: 1.2 + Math.random() * 2.6,
      len: 8 + Math.floor(Math.random() * 14),
      chars: null,
      flicker: Math.random() * Math.PI * 2
    }));
    columns.forEach(c => {
      c.chars = new Array(c.len).fill(0).map(() => RAIN_CHARS[Math.floor(Math.random() * RAIN_CHARS.length)]);
    });
  }

  function drawRain(dt){
    ctx.font = '13px "JetBrains Mono", monospace';
    ctx.textAlign = 'center';
    for (const c of columns){
      c.y += c.speed * dt * 0.06;
      c.flicker += dt * 0.002;
      if (c.y - c.len * 18 > H){
        c.y = -Math.random() * H * 0.5;
        c.speed = 1.2 + Math.random() * 2.6;
        c.chars = c.chars.map(() => RAIN_CHARS[Math.floor(Math.random() * RAIN_CHARS.length)]);
      }
      // occasionally mutate a character for a "live code" feel
      if (Math.random() < 0.01){
        const idx = Math.floor(Math.random() * c.chars.length);
        c.chars[idx] = RAIN_CHARS[Math.floor(Math.random() * RAIN_CHARS.length)];
      }
      for (let i = 0; i < c.chars.length; i++){
        const cy = c.y - i * 18;
        if (cy < -20 || cy > H + 20) continue;
        const isHead = i === 0;
        const fade = 1 - i / c.chars.length;
        const glow = 0.15 + 0.1 * Math.sin(c.flicker + i);
        const isHeart = c.chars[i] === '♥' || c.chars[i] === '♡';
        const alpha = Math.max(0, fade) * (isHead ? 0.9 : 0.5) + glow;
        ctx.fillStyle = isHeart
          ? `rgba(255, 90, 150, ${Math.min(alpha, 0.85)})`
          : isHead
            ? `rgba(255, 210, 230, ${Math.min(alpha, 0.95)})`
            : `rgba(255, 47, 120, ${Math.min(alpha, 0.6)})`;
        ctx.fillText(c.chars[i], c.x, cy);
      }
    }
  }

  // ---------- OFFSCREEN SAMPLING (text -> particle points) ----------
  const off = document.createElement('canvas');
  const offCtx = off.getContext('2d');

  function samplePointsFromText(text, fontPx, fontFamily, targetCount){
    off.width = W;
    off.height = H;
    offCtx.clearRect(0, 0, W, H);
    offCtx.fillStyle = '#fff';
    offCtx.textAlign = 'center';
    offCtx.textBaseline = 'middle';

    const lines = String(text).split('\n');

    // auto-fit: shrink font so the widest line stays within 90% of screen width
    let size = fontPx;
    offCtx.font = `700 ${size}px ${fontFamily}`;
    const maxAllowed = W * 0.9;
    let widest = Math.max(...lines.map(l => offCtx.measureText(l).width));
    if (widest > maxAllowed){
      size = size * (maxAllowed / widest);
      offCtx.font = `700 ${size}px ${fontFamily}`;
    }

    const lineHeight = size * 1.25;
    const totalHeight = lineHeight * lines.length;
    const startY = H / 2 - totalHeight / 2 + lineHeight / 2;
    lines.forEach((line, i) => {
      offCtx.fillText(line, W / 2, startY + i * lineHeight);
    });

    const data = offCtx.getImageData(0, 0, W, H).data;
    const raw = [];
    const step = 4; // sampling grid density
    for (let y = 0; y < H; y += step){
      for (let x = 0; x < W; x += step){
        const idx = (y * W + x) * 4 + 3;
        if (data[idx] > 120){
          raw.push({ x, y });
        }
      }
    }
    // downsample/upsample toward targetCount for consistent density
    if (raw.length === 0) return [];
    let points;
    if (raw.length > targetCount){
      points = [];
      const strideF = raw.length / targetCount;
      for (let i = 0; i < targetCount; i++){
        points.push(raw[Math.floor(i * strideF)]);
      }
    } else {
      points = raw;
    }
    return points;
  }

  function heartCurvePoints(cx, cy, scale, count){
    const pts = [];
    for (let i = 0; i < count; i++){
      const t = (i / count) * Math.PI * 2;
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
      pts.push({ x: cx + x * scale, y: cy + y * scale });
    }
    return pts;
  }

  // ---------- PARTICLES ----------
  class Particle{
    constructor(tx, ty, color){
      this.x = tx + (Math.random() - 0.5) * W * 1.4;
      this.y = ty + (Math.random() - 0.5) * H * 1.4;
      this.tx = tx; this.ty = ty;
      this.vx = 0; this.vy = 0;
      this.alpha = 0;
      this.state = 'enter'; // enter -> hold -> leave
      this.size = 1.6 + Math.random() * 1.6;
      this.color = color;
      this.leaveAngle = Math.random() * Math.PI * 2;
      this.leaveSpeed = 2 + Math.random() * 3;
    }
    update(dt){
      if (this.state === 'enter' || this.state === 'hold'){
        const dx = this.tx - this.x, dy = this.ty - this.y;
        this.x += dx * Math.min(1, dt * 0.006);
        this.y += dy * Math.min(1, dt * 0.006);
        this.alpha += (1 - this.alpha) * Math.min(1, dt * 0.008);
      } else if (this.state === 'leave'){
        this.x += Math.cos(this.leaveAngle) * this.leaveSpeed * dt * 0.05;
        this.y += Math.sin(this.leaveAngle) * this.leaveSpeed * dt * 0.05;
        this.alpha -= dt * 0.0022;
      }
    }
    draw(ctx){
      if (this.alpha <= 0.01) return;
      ctx.globalAlpha = Math.max(0, Math.min(1, this.alpha));
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  let particles = [];

  function spawnTextPhase(text, options = {}){
    const fontPx = options.fontPx || Math.min(W * 0.22, H * 0.32);
    const color = options.color || 'rgba(243, 237, 226, 1)';
    const count = options.count || 650;
    const pts = samplePointsFromText(text, fontPx, "'JetBrains Mono', monospace", count);
    particles = pts.map(p => new Particle(p.x, p.y, color));
  }

  function beginLeave(){
    particles.forEach(p => { p.state = 'leave'; });
  }

  // ---------- HEART FINALE ----------
  let heartParticles = [];
  let heartLabel = { text: 'I Love❤️You Nurfah', alpha: 0, targetAlpha: 0 };
  let heartAlpha = 0, heartTargetAlpha = 0;

  function buildHeart(){
    const cx = W / 2, cy = H / 2 - Math.min(H, W) * 0.02;
    const scale = Math.min(W, H) * 0.017;
    const outer = heartCurvePoints(cx, cy, scale, 46);
    const inner = heartCurvePoints(cx, cy, scale * 0.82, 34);
    heartParticles = [...outer, ...inner].map((p, i) => ({
      x: p.x, y: p.y,
      baseX: p.x, baseY: p.y,
      size: 6 + Math.random() * 6,
      phase: Math.random() * Math.PI * 2,
      speed: 0.8 + Math.random() * 1.2
    }));
  }

  function drawHeart(t){
    if (heartAlpha <= 0.005) return;
    ctx.save();
    ctx.globalAlpha = heartAlpha;
    ctx.font = `20px sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (const hp of heartParticles){
      const bob = Math.sin(t * 0.002 * hp.speed + hp.phase) * 3;
      ctx.font = `${hp.size + bob * 0.4}px sans-serif`;
      ctx.fillStyle = `rgba(255, 70, 130, ${0.75 + 0.25 * Math.sin(t * 0.003 + hp.phase)})`;
      ctx.fillText('❤', hp.baseX, hp.baseY + bob);
    }
    ctx.restore();

    if (heartLabel.alpha > 0.005){
      ctx.save();
      ctx.globalAlpha = heartLabel.alpha;
      const cy = H / 2 - Math.min(H, W) * 0.02;
      const fontPx = Math.max(14, Math.min(W, H) * 0.032);
      ctx.font = `600 ${fontPx}px 'Quicksand', sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowColor = 'rgba(255,47,120,0.8)';
      ctx.shadowBlur = 18;
      ctx.fillStyle = '#fff0f5';
      ctx.fillText(heartLabel.text, W / 2, cy);
      ctx.restore();
    }
  }

  // ---------- SEQUENCE CONTROLLER ----------
  let sequenceRunning = false;
  let seqTimer = null;

  function clearTimers(){
    if (seqTimer) { clearTimeout(seqTimer); seqTimer = null; }
  }

  async function runSequence(name){
    clearTimers();
    sequenceRunning = true;
    particles = [];
    heartAlpha = 0; heartTargetAlpha = 0;
    heartLabel.alpha = 0;

    const wait = (ms) => new Promise(res => { seqTimer = setTimeout(res, ms); });

    // pantun 2 baris — baris pertama sampiran, baris kedua isi (memuat nama)
    const pantunSampiran = 'Pagi cerah memetik buah,\nTerbang camar di atas karang,';
    const pantunIsi = `${name || RECIPIENT_NAME} wajah mu yang indah,\nSayang ku tak pernah hilang.`;

    const steps = [
      { text: '3', hold: 550, fontScale: 0.4, enter: 700, leave: 650 },
      { text: '2', hold: 550, fontScale: 0.4, enter: 700, leave: 650 },
      { text: '1', hold: 550, fontScale: 0.4, enter: 700, leave: 650 },
      { text: pantunSampiran, hold: 2400, fontScale: 0.16, enter: 1100, leave: 900, count: 1500 },
      { text: pantunIsi, hold: 2400, fontScale: 0.16, enter: 1100, leave: 900, count: 1500 }
    ];

    for (const step of steps){
      spawnTextPhase(step.text, {
        fontPx: Math.min(W, H) * step.fontScale,
        color: 'rgba(243, 237, 226, 1)',
        count: step.count || Math.min(750, 260 + step.text.length * 90)
      });
      await wait(step.enter || 700); // let it materialize
      await wait(step.hold);
      beginLeave();
      await wait(step.leave || 650); // let it disperse before next phase
    }

    // finale
    buildHeart();
    heartLabel.text = `I Love❤️You ${name || 'Nurfah'}`;
    heartTargetAlpha = 1;
    heartLabel.targetAlpha = 1;
    sequenceRunning = false;
  }

  // ---------- MAIN LOOP ----------
  let last = performance.now();
  function frame(now){
    const dt = Math.min(48, now - last);
    last = now;

    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(5,3,8,1)';
    ctx.fillRect(0, 0, W, H);

    drawRain(dt);

    // fade heart in/out toward target
    heartAlpha += (heartTargetAlpha - heartAlpha) * Math.min(1, dt * 0.004);
    heartLabel.alpha += (heartLabel.targetAlpha - heartLabel.alpha) * Math.min(1, dt * 0.004);
    drawHeart(now);

    particles.forEach(p => { p.update(dt); p.draw(ctx); });
    particles = particles.filter(p => p.alpha > 0.01 || p.state !== 'leave');

    requestAnimationFrame(frame);
  }

  // ---------- MUSIC ----------
  const bgm = document.getElementById('bgm');
  const muteBtn = document.getElementById('muteBtn');
  let musicStarted = false;
  let muted = false;

  if (MUSIC_SRC){
    bgm.src = MUSIC_SRC;
    bgm.loop = MUSIC_LOOP;
    bgm.volume = MUSIC_VOLUME;
  } else {
    muteBtn.style.display = 'none';
  }

  function tryStartMusic(){
    if (!MUSIC_SRC || musicStarted) return;
    musicStarted = true;
    bgm.play().catch(() => {
      // browser blocked autoplay; user can still press the mute/play button
      musicStarted = false;
    });
  }

  muteBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (!musicStarted){
      tryStartMusic();
      muteBtn.textContent = '🔊';
      muted = false;
      return;
    }
    muted = !muted;
    bgm.muted = muted;
    muteBtn.textContent = muted ? '🔇' : '🔊';
  });

  // ---------- PLAY CONTROL ----------
  function start(){
    tryStartMusic();
    if (sequenceRunning) return;
    runSequence(RECIPIENT_NAME);
  }

  if (CLICK_TO_REPLAY){
    window.addEventListener('click', start);
    window.addEventListener('touchstart', start, { passive: true });
  }

  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(frame);

  // auto-play once on load
  setTimeout(start, 500);
})();
</script>
</body>
</html>
